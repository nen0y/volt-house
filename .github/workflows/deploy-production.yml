name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to e-kit.com.ua
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          test -n "$PROD_SSH_KEY"
          DEPLOY_PORT="${PROD_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$PROD_HOST" > ~/.ssh/known_hosts

      - name: Update and rebuild production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${PROD_PORT:-22}"
          DEPLOY_USER="${PROD_USER:-root}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$PROD_HOST" 'bash -se' <<'DEPLOY_SCRIPT'
          set -euo pipefail
          cd /opt/e-kit

          mkdir -p backups
          BACKUP_STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          if docker container inspect volthouse-back >/dev/null 2>&1; then
            docker cp volthouse-back:/app/data/volthouse.db "backups/volthouse-before-postgres-${BACKUP_STAMP}.db" 2>/dev/null || true
          fi
          if docker container inspect e-kit-postgres >/dev/null 2>&1; then
            docker exec e-kit-postgres pg_dump -U e_kit -d e_kit > "backups/e-kit-postgres-${BACKUP_STAMP}.sql"
          fi

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.https.yml \
            config --quiet

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.https.yml \
            up -d --build --force-recreate

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.https.yml \
            ps
          DEPLOY_SCRIPT
