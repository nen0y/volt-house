services:
  backend:
    build: .
    container_name: volthouse-backend
    restart: unless-stopped
    environment:
      # SQLite database file lives on a named volume so data survives restarts
      DATABASE_URL: file:/app/data/volthouse.db
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-omelyazuk@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-VoltHouse2024}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Uploaded images live on the persisted volume so they survive restarts
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "4000:4000"
    volumes:
      - dbdata:/app/data

volumes:
  dbdata:
